[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lefiru-analyzer"
dynamic = ["version"]
description = "Security analysis of Excel workbooks and Python code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "juajojim" }]
keywords = ["security", "excel", "vba", "python", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

dependencies = [
  "openpyxl>=3.1",
  "pyxlsb>=1.0",
  "PyYAML>=6",
  # fallback PDF renderer; the LaTeX engine (MiKTeX/TeX Live) is a system
  # dependency and cannot be installed with pip. See README "LaTeX engine".
  "reportlab>=4",
  "oletools>=0.60",
  "msoffcrypto-tool>=5",
  "Pillow>=10",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
  "pywin32-ctypes>=0.2.2; sys_platform == 'win32'",
]
gui = [
  "PyQt6>=6.6",
  "PyQt6-Frameless-Window>=0.7",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[project.scripts]
lefiru = "lefiru.cli.main:main"
lefiru-analyzer = "lefiru.ui.app:main"

[project.urls]
Homepage = "https://github.com/juajojim/lefiru-analyzer"
Issues = "https://github.com/juajojim/lefiru-analyzer/issues"

[tool.hatch.version]
path = "src/lefiru/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lefiru"]

# ── Quality ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Conservative start: only real errors (syntax, undefined names).
# Rules are expanded one at a time as the code is cleaned up.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
  "com: requires Excel installed and COM automation",
  "slow: long analysis (more than a minute)",
]
addopts = "-ra"
